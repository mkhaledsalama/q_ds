  /* ==================== PAGE H: BOOKMARKS & REVISION ==================== */
  function renderRevision() {
    var root = document.getElementById('page-revision');
    if (!root) return;
    var t = window.MSDS_I18N.t;
    var lang = window.MSDS_I18N.getLang();
    var st = window.MSDS_STORAGE.load();
    var p = window.MSDS_PROGRESS.compute();

    var wrongQs = p.wrongQuestionIds.map(function (id) { return window.MSDS_QUESTIONS.find(function (q) { return q.id === id; }); }).filter(Boolean);
    var savedQs = (st.bookmarkedQuestions || []).map(function (id) { return window.MSDS_QUESTIONS.find(function (q) { return q.id === id; }); }).filter(Boolean);
    var savedVs = (st.vocabFavorites || []).map(function (id) { return window.MSDS_VOCAB_TERMS.find(function (v) { return v.id === id; }); }).filter(Boolean);
    var savedEs = (st.bookmarkedExplanations || []).map(function (id) { return window.MSDS_STUDY_TOPICS.find(function (x) { return x.id === id; }); }).filter(Boolean);

    var body = '';
    if (stateUI.revTab === 'wrong') {
      body = wrongQs.length ? wrongQs.map(function (q) {
        var qs = st.questionStats[q.id];
        return '<div class="card" style="margin-bottom:10px;">' +
          '<span class="badge badge-err">' + q.topicId.toUpperCase() + '</span>' +
          '<p style="margin:6px 0 4px;font-weight:700;">' + esc(q.question) + '</p>' +
          '<div style="font-size:0.86rem;color:var(--err-color);"><strong>' + t('yourAnsLabel') + ':</strong> ' + esc(qs.lastWrongAnswer) + '</div>' +
          '<div style="font-size:0.86rem;color:var(--ok-color);"><strong>' + t('correctAnsLabel') + ':</strong> ' + esc(q.type === 'fill' ? q.displayAnswer : q.options[q.correctIndex]) + '</div>' +
          '<div style="font-size:0.84rem;color:var(--text-muted);margin-top:4px;">' + esc(lang === 'ar' ? q.expAr : q.expEn) + '</div>' +
        '</div>';
      }).join('') : '<div class="empty-box">' + t('emptySection') + '</div>';
    } else if (stateUI.revTab === 'savedQ') {
      body = savedQs.length ? savedQs.map(function (q) {
        return '<div class="card" style="margin-bottom:10px;"><strong>' + esc(q.question) + '</strong>' +
          '<div style="font-size:0.86rem;color:var(--ok-color);margin-top:4px;">' + esc(q.type === 'fill' ? q.displayAnswer : q.options[q.correctIndex]) + '</div></div>';
      }).join('') : '<div class="empty-box">' + t('emptySection') + '</div>';
    } else if (stateUI.revTab === 'savedV') {
      body = savedVs.length ? '<div class="vocab-grid">' + savedVs.map(function (v) {
        return '<div class="card"><strong>' + esc(v.term) + ' — ' + esc(v.arMeaning) + '</strong><p style="margin:6px 0 0;font-size:0.86rem;">' + esc(lang === 'ar' ? v.arExp : v.enDef) + '</p></div>';
      }).join('') + '</div>' : '<div class="empty-box">' + t('emptySection') + '</div>';
    } else {
      body = savedEs.length ? savedEs.map(function (tp) {
        return '<div class="card" style="margin-bottom:10px;"><strong>' + esc(tp.title[lang]) + '</strong><p style="margin:6px 0 0;font-size:0.88rem;">' + esc(tp.summary[lang]) + '</p></div>';
      }).join('') : '<div class="empty-box">' + t('emptySection') + '</div>';
    }

    root.innerHTML =
      '<div class="page-head">' +
        '<div class="eyebrow">M&lt;&gt;S · ' + t('navRevision') + '</div>' +
        '<h1 class="page-title">' + t('revisionTitle') + '</h1>' +
        '<p class="page-sub">' + t('revisionSubtitle') + '</p>' +
      '</div>' +
      '<div class="tabs-row">' +
        '<button class="tab-btn ' + (stateUI.revTab === 'wrong' ? 'active' : '') + '" data-rt="wrong">' + t('tabWrong') + ' (' + wrongQs.length + ')</button>' +
        '<button class="tab-btn ' + (stateUI.revTab === 'savedQ' ? 'active' : '') + '" data-rt="savedQ">' + t('tabSavedQ') + ' (' + savedQs.length + ')</button>' +
        '<button class="tab-btn ' + (stateUI.revTab === 'savedV' ? 'active' : '') + '" data-rt="savedV">' + t('tabSavedV') + ' (' + savedVs.length + ')</button>' +
        '<button class="tab-btn ' + (stateUI.revTab === 'savedE' ? 'active' : '') + '" data-rt="savedE">' + t('tabSavedE') + ' (' + savedEs.length + ')</button>' +
        (wrongQs.length ? '<button class="btn btn-primary btn-sm" id="btn-quick-rev" style="margin-inline-start:auto;">' + t('quickRevBtn') + '</button>' : '') +
      '</div>' + body;

    root.querySelectorAll('[data-rt]').forEach(function (b) { b.addEventListener('click', function () { stateUI.revTab = b.getAttribute('data-rt'); renderRevision(); }); });
    var qr = document.getElementById('btn-quick-rev');
    if (qr) qr.addEventListener('click', function () {
      window.MSDS_QUIZ.start({ onlyIds: p.wrongQuestionIds, count: p.wrongQuestionIds.length, viewMode: 'single' });
      navigateTo('practice');
    });
  }

  function renderCurrent() {
    syncChrome();
    var p = stateUI.currentPage;
    if (p === 'home') renderHome();
    else if (p === 'study') renderStudy();
    else if (p === 'vocabulary') renderVocabulary();
    else if (p === 'practice') renderPractice();
    else if (p === 'flashcards') renderFlashcards();
    else if (p === 'exams') renderExams();
    else if (p === 'results') renderResults();
    else if (p === 'revision') renderRevision();
  }

  function init() {
    var st = window.MSDS_STORAGE.load();
    window.MSDS_I18N.apply(st.lang || 'en');
    document.documentElement.setAttribute('data-theme', st.theme || 'light');

    stateUI.currentPage = document.body.getAttribute('data-page') || 'home';
    var params = new URLSearchParams(window.location.search);
    if (params.get('topic')) stateUI.studyTopic = params.get('topic');
    else stateUI.studyTopic = st.lastTopicId || 'topic1';

    document.querySelectorAll('[data-nav]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        if (isSpa()) {
          e.preventDefault();
          navigateTo(el.getAttribute('data-nav'));
        }
      });
    });

    var mBtn = document.getElementById('btn-mobile');
    if (mBtn) mBtn.addEventListener('click', function () { document.getElementById('mobile-drawer').classList.toggle('open'); });

    var lBtn = document.getElementById('btn-lang');
    if (lBtn) lBtn.addEventListener('click', function () {
      window.MSDS_I18N.toggle();
      renderCurrent(); /* Preserves active quiz/exam/study state! */
    });

    var tBtn = document.getElementById('btn-theme');
    if (tBtn) tBtn.addEventListener('click', function () {
      var next = (window.MSDS_STORAGE.load().theme || 'light') === 'light' ? 'dark' : 'light';
      window.MSDS_STORAGE.update(function (s) { s.theme = next; });
      document.documentElement.setAttribute('data-theme', next);
      syncChrome();
    });

    /* Confirm Submit Exam Modal */
    var cCancel = document.getElementById('modal-cancel');
    if (cCancel) cCancel.addEventListener('click', function () { document.getElementById('confirm-modal').classList.remove('open'); });
    var cOk = document.getElementById('modal-confirm');
    if (cOk) cOk.addEventListener('click', function () {
      document.getElementById('confirm-modal').classList.remove('open');
      window.MSDS_EXAMS.submit();
      renderExams();
    });

    /* Keyboard navigation for Flashcards */
    document.addEventListener('keydown', function (e) {
      if (stateUI.currentPage !== 'flashcards') return;
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') { e.preventDefault(); window.MSDS_FLASHCARDS.flip(); renderFlashcards(); }
      else if (e.code === 'ArrowRight') { window.MSDS_FLASHCARDS.next(); renderFlashcards(); }
      else if (e.code === 'ArrowLeft') { window.MSDS_FLASHCARDS.prev(); renderFlashcards(); }
    });

    renderCurrent();
  }

  document.addEventListener('DOMContentLoaded', init);

  return { navigateTo: navigateTo, renderCurrent: renderCurrent };
})();

  </script>
</body>
</html>
