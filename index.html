  <style>
/* ==========================================================================
   M<>S Data Science Platform — Strict Palette Tokens (css/themes.css)
   Exact Light & Dark Color Specification (Zero Blue, Zero Purple, Zero Neon)
   ========================================================================== */

:root {
  --bg-main: #F0F1ED;
  --bg-card: #FFFFFF;
  --bg-surface: #E7EAE4;
  --primary: #17432E;
  --secondary: #315B42;
  --accent: #315B42;
  --text-main: #202820;
  --text-muted: #777F77;
  --border: #DDE2DC;

  --primary-soft: rgba(23, 67, 46, 0.09);
  --ok-color: #17432E;
  --ok-bg: #E3EFE8;
  --err-color: #8C2D23;
  --err-bg: #F6E6E4;
  --warn-color: #7A5C1E;
  --warn-bg: #F4EEE0;

  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-serif: 'Source Serif 4', Georgia, serif;
  --font-ar: 'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --radius: 6px;
  --shadow: 0 1px 3px rgba(32, 40, 32, 0.06);
  --nav-h: 64px;
}

[data-theme="dark"] {
  --bg-main: #151916;
  --bg-card: #202722;
  --bg-surface: #303B33;
  --primary: #24563A;
  --secondary: #303B33;
  --accent: #76A785;
  --text-main: #F3F4EF;
  --text-muted: #A8B3A9;
  --border: #303B33;

  --primary-soft: rgba(118, 167, 133, 0.14);
  --ok-color: #76A785;
  --ok-bg: rgba(36, 86, 58, 0.36);
  --err-color: #E58C83;
  --err-bg: rgba(140, 45, 35, 0.30);
  --warn-color: #D9B76C;
  --warn-bg: rgba(122, 92, 30, 0.28);

  --shadow: 0 2px 8px rgba(0, 0, 0, 0.30);
}

[dir="rtl"] body {
  font-family: var(--font-ar);
}

/* ==========================================================================
   M<>S Data Science Platform — Core Stylesheet (css/style.css)
   Minimal, Academic, Mobile-First, Zero Horizontal Overflow
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html { font-size: 16px; overflow-x: hidden; scroll-behavior: smooth; }

body {
  margin: 0;
  background-color: var(--bg-main);
  color: var(--text-main);
  font-family: var(--font-sans);
  line-height: 1.6;
  overflow-x: hidden;
  transition: background-color 0.2s ease, color 0.2s ease;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
svg { max-width: 100%; height: auto; display: block; }

/* ==================== GEOMETRIC M<>S LOGO ==================== */
.ms-logo {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: none;
  padding: 4px 0;
  flex-shrink: 0;
}

.ms-logo-box {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 5px 10px;
  background-color: var(--primary);
  color: #F3F4EF;
  border: 1px solid var(--secondary);
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 0.96rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}

.ms-logo-diamond {
  color: #A8B3A9;
  font-weight: 600;
}

[data-theme="dark"] .ms-logo-diamond { color: var(--accent); }

.ms-logo-sub {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text-muted);
  display: none;
}

/* ==================== TOP NAVIGATION ==================== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  height: var(--nav-h);
  background-color: var(--bg-card);
  border-bottom: 1px solid var(--border);
}

.topbar-inner {
  max-width: 1200px;
  margin: 0 auto;
  height: 100%;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.nav-links {
  display: none;
  align-items: center;
  gap: 3px;
}

.nav-item {
  display: inline-flex;
  align-items: center;
  padding: 7px 11px;
  border-radius: 4px;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-muted);
  background: transparent;
  border: 1px solid transparent;
  white-space: nowrap;
  transition: background-color 0.15s ease, color 0.15s ease;
}

.nav-item:hover { background-color: var(--bg-surface); color: var(--text-main); }
.nav-item.active { background-color: var(--primary); color: #F3F4EF; }

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.ctrl-btn {
  min-height: 36px;
  padding: 6px 10px;
  border-radius: 4px;
  background-color: var(--bg-surface);
  border: 1px solid var(--border);
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-main);
}

.ctrl-btn:hover { border-color: var(--accent); }

.mobile-drawer {
  display: none;
  background-color: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 16px;
}

.mobile-drawer.open { display: block; }

.mobile-drawer-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.mobile-drawer .nav-item {
  width: 100%;
  justify-content: flex-start;
  border: 1px solid var(--border);
  padding: 10px 12px;
}

/* ==================== LAYOUT & HEADERS ==================== */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 16px 64px;
  width: 100%;
}

.page-head {
  margin-bottom: 22px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}

.eyebrow {
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.page-title {
  margin: 4px 0 6px;
  font-family: var(--font-serif);
  font-size: 1.7rem;
  line-height: 1.25;
}

[dir="rtl"] .page-title { font-family: var(--font-ar); }

.page-sub { margin: 0; font-size: 0.94rem; color: var(--text-muted); }

/* ==================== CARDS, BUTTONS & BADGES ==================== */
.card {
  background-color: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}

.card-subtle {
  background-color: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 8px 16px;
  border-radius: 4px;
  font-size: 0.88rem;
  font-weight: 600;
  border: 1px solid transparent;
  transition: background-color 0.15s ease, border-color 0.15s ease;
  white-space: nowrap;
}

.btn-primary { background-color: var(--primary); color: #F3F4EF; border-color: var(--primary); }
.btn-primary:hover { background-color: var(--secondary); }
.btn-secondary { background-color: var(--bg-card); color: var(--text-main); border-color: var(--border); }
.btn-secondary:hover { border-color: var(--accent); background-color: var(--bg-surface); }
.btn-danger { background-color: var(--err-color); color: #F3F4EF; }
.btn-sm { min-height: 32px; padding: 5px 11px; font-size: 0.82rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.74rem;
  font-weight: 700;
}

.badge-green { background-color: var(--ok-bg); color: var(--ok-color); }
.badge-err { background-color: var(--err-bg); color: var(--err-color); }
.badge-muted { background-color: var(--bg-surface); color: var(--text-muted); border: 1px solid var(--border); }

.input, .select {
  width: 100%;
  min-height: 40px;
  padding: 8px 12px;
  background-color: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-main);
}

.input:focus, .select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ==================== DASHBOARD ==================== */
.hero-card {
  background-color: var(--bg-card);
  border: 1px solid var(--border);
  border-inline-start: 4px solid var(--primary);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.stat-box {
  background-color: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px;
}

.stat-k { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
.stat-v { font-size: 1.55rem; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }

.topics-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  margin-bottom: 22px;
}

.topic-card {
  background-color: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.topic-num {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  font-weight: 800;
  color: var(--accent);
}

.progress-track {
  width: 100%;
  height: 8px;
  background-color: var(--bg-surface);
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background-color: var(--primary);
  transition: width 0.3s ease;
}

[data-theme="dark"] .progress-fill { background-color: var(--accent); }

.dash-two-col {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
}

/* ==================== VOCABULARY & FLASHCARDS (3D FLIP) ==================== */
.tabs-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}

.tab-btn {
  padding: 7px 12px;
  border-radius: 4px;
  background-color: var(--bg-card);
  border: 1px solid var(--border);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
}

.tab-btn.active { background-color: var(--primary); color: #F3F4EF; border-color: var(--primary); }

.vocab-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

.flip-scene {
  perspective: 1000px;
  min-height: 250px;
}

.flip-card {
  position: relative;
  width: 100%;
  min-height: 250px;
  transform-style: preserve-3d;
  transition: transform 0.45s ease;
}

.flip-card.flipped { transform: rotateY(180deg); }

.flip-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  background-color: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.flip-back {
  transform: rotateY(180deg);
  border-color: var(--accent);
}

/* ==================== PRACTICE & EXAMS ==================== */
.config-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.opt-list { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }

.opt-btn {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
  padding: 12px 14px;
  text-align: start;
  background-color: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 0.92rem;
}

.opt-btn:hover { border-color: var(--accent); }
.opt-btn.selected { border-color: var(--primary); background-color: var(--primary-soft); font-weight: 600; }
.opt-btn.ok { border-color: var(--ok-color); background-color: var(--ok-bg); }
.opt-btn.err { border-color: var(--err-color); background-color: var(--err-bg); }

.opt-key {
  min-width: 24px;
  height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  background-color: var(--bg-card);
  border: 1px solid var(--border);
  font-weight: 700;
  font-size: 0.8rem;
  flex-shrink: 0;
}

/* Interactive Touch-Friendly Matching Board */
.match-board {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  margin-top: 14px;
}

.match-col { display: flex; flex-direction: column; gap: 8px; }

.match-item {
  width: 100%;
  padding: 12px;
  text-align: start;
  background-color: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 0.9rem;
}

.match-item.picking { border: 2px solid var(--primary); background-color: var(--primary-soft); }
.match-item.paired { border-color: var(--accent); background-color: var(--bg-card); }
.match-item.ok { border-color: var(--ok-color); background-color: var(--ok-bg); }
.match-item.err { border-color: var(--err-color); background-color: var(--err-bg); }

.fb-box {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 4px;
  border: 1px solid var(--border);
  font-size: 0.88rem;
}

.fb-box.ok { background-color: var(--ok-bg); border-color: var(--ok-color); }
.fb-box.err { background-color: var(--err-bg); border-color: var(--err-color); }

.timer-pill {
  font-family: var(--font-mono);
  font-weight: 800;
  padding: 5px 12px;
  border-radius: 4px;
  background-color: var(--bg-surface);
  border: 1px solid var(--border);
}

/* Modal & Toast */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(21, 25, 22, 0.58);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 200;
}

.modal-bg.open { display: flex; }

.modal-card {
  background-color: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-width: 440px;
  width: 100%;
  padding: 22px;
}

.toast {
  position: fixed;
  bottom: 20px;
  inset-inline-end: 20px;
  z-index: 300;
  background-color: var(--primary);
  color: #F3F4EF;
  padding: 10px 16px;
  border-radius: 4px;
  font-size: 0.86rem;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transform: translateY(6px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.toast.show { opacity: 1; transform: translateY(0); }

.empty-box {
  text-align: center;
  padding: 28px 16px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  color: var(--text-muted);
  background-color: var(--bg-surface);
}

.table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
.table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.table th, .table td { padding: 10px 12px; text-align: start; border-bottom: 1px solid var(--border); }
.table th { background-color: var(--bg-surface); font-weight: 700; color: var(--text-muted); }

/* Single-File Canvas SPA View Toggle */
.spa-view { display: none; }
.spa-view.active { display: block; }

/* ==========================================================================
   M<>S Data Science Platform — Responsive Breakpoints (css/responsive.css)
   Mobile-first for 360px, 390px, 768px, 1024px, 1440px
   ========================================================================== */

@media (min-width: 640px) {
  .ms-logo-sub { display: inline; }
  .match-board { grid-template-columns: 1fr 1fr; }
}

@media (min-width: 768px) {
  .container { padding: 26px 24px 72px; }
  .page-title { font-size: 2rem; }
  .hero-card { flex-direction: row; align-items: center; justify-content: space-between; padding: 26px; }
  .stats-row { grid-template-columns: repeat(4, 1fr); }
  .topics-grid { grid-template-columns: repeat(3, 1fr); }
  .vocab-grid { grid-template-columns: repeat(2, 1fr); }
  .config-grid { grid-template-columns: repeat(2, 1fr); }
  .dash-two-col { grid-template-columns: 1.35fr 1fr; align-items: start; }
}

@media (min-width: 1024px) {
  .nav-links { display: flex; }
  .mobile-menu-btn, .mobile-drawer { display: none !important; }
  .config-grid { grid-template-columns: repeat(4, 1fr); }
  .vocab-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 390px) {
  .topbar-inner { padding: 0 10px; gap: 6px; }
  .ctrl-btn { padding: 5px 8px; font-size: 0.76rem; }
  .mobile-drawer-grid { grid-template-columns: 1fr; }
  .card { padding: 15px; }
}

  </style>
</head>

/* ==========================================================================
   M<>S Data Science Platform — LocalStorage Persistence (js/storage.js)
   ========================================================================== */

window.MSDS_STORAGE = (function () {
  var KEY = 'ms_datascience_platform_v2';
  var mem = null;

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function defaults() {
    return {
      lang: 'en',
      theme: 'light',
      completedTopics: [],
      lastTopicId: 'topic1',
      dailyGoal: 15,
      dailyCount: 0,
      lastStudyDate: '',
      streak: 0,
      vocabUnderstood: [],
      vocabFavorites: [],
      bookmarkedQuestions: [],
      bookmarkedExplanations: [],
      flashcardStatus: {},      /* cardId -> 'known' | 'review' */
      questionStats: {},        /* qId -> { attempts, correct, wrong, lastWrongAnswer, resolved } */
      examHistory: [],          /* array of full exam attempt records */
      practiceHistory: [],      /* array of practice session summaries */
      recentActivity: []        /* chronological log */
    };
  }

  function load() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return defaults();
      return Object.assign(defaults(), JSON.parse(raw));
    } catch (e) {
      return mem ? Object.assign(defaults(), mem) : defaults();
    }
  }

  function save(state) {
    mem = state;
    try {
      window.localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) { /* Safe fallback */ }
  }

  function touchStreak(state) {
    var today = todayKey();
    if (state.lastStudyDate === today) return;
    if (state.lastStudyDate) {
      var prev = new Date(state.lastStudyDate + 'T00:00:00');
      var cur = new Date(today + 'T00:00:00');
      var diffDays = Math.round((cur - prev) / 86400000);
      state.streak = diffDays === 1 ? (state.streak || 0) + 1 : 1;
    } else {
      state.streak = 1;
    }
    state.lastStudyDate = today;
    state.dailyCount = 0;
  }

  function update(fn) {
    var s = load();
    fn(s);
    save(s);
    return s;
  }

  function logActivity(state, titleEn, titleAr, detail) {
    touchStreak(state);
    state.recentActivity = state.recentActivity || [];
    state.recentActivity.unshift({
      titleEn: titleEn,
      titleAr: titleAr,
      detail: detail,
      ts: Date.now()
    });
    if (state.recentActivity.length > 20) state.recentActivity = state.recentActivity.slice(0, 20);
  }

  function recordAnswer(qId, isCorrect, userAnswerText) {
    return update(function (s) {
      touchStreak(s);
      s.dailyCount = (s.dailyCount || 0) + 1;
      var st = s.questionStats[qId] || { attempts: 0, correct: 0, wrong: 0, lastWrongAnswer: '', resolved: false };
      st.attempts += 1;
      if (isCorrect) {
        st.correct += 1;
        st.resolved = true;
      } else {
        st.wrong += 1;
        st.lastWrongAnswer = String(userAnswerText || '—');
        st.resolved = false;
      }
      s.questionStats[qId] = st;
    });
  }

  function resetAll() {
    var d = defaults();
    save(d);
    return d;
  }

  return {
    KEY: KEY,
    load: load,
    save: save,
    update: update,
    logActivity: logActivity,
    recordAnswer: recordAnswer,
    touchStreak: touchStreak,
    resetAll: resetAll
  };
})();

/* ==========================================================================
   M<>S Data Science Platform — Analytics & Progress Engine (js/progress.js)
   All metrics derived strictly from actual stored user activity.
   ========================================================================== */

window.MSDS_PROGRESS = (function () {
  function getTopicStats(topicId, state) {
    var qs = window.MSDS_QUESTIONS.filter(function (q) { return q.topicId === topicId; });
    var answered = 0, correct = 0, wrong = 0;
    qs.forEach(function (q) {
      var st = state.questionStats[q.id];
      if (st && st.attempts > 0) {
        answered += 1;
        correct += st.correct;
        wrong += st.wrong;
      }
    });
    var totalAttempts = correct + wrong;
    var accuracy = totalAttempts ? Math.round((correct / totalAttempts) * 100) : 0;
    var topicDone = (state.completedTopics || []).indexOf(topicId) !== -1;
    var progressPct = Math.min(100, Math.round(((topicDone ? 50 : 0) + (qs.length ? (answered / qs.length) * 50 : 0))));
    return {
      topicId: topicId,
      totalQuestions: qs.length,
      answeredUnique: answered,
      correct: correct,
      wrong: wrong,
      totalAttempts: totalAttempts,
      accuracy: accuracy,
      topicDone: topicDone,
      progressPct: progressPct
    };
  }

  function compute() {
    var state = window.MSDS_STORAGE.load();
    var topics = ['topic1', 'topic2', 'topic3'].map(function (tid) { return getTopicStats(tid, state); });

    var totalCorrect = 0, totalWrong = 0, totalUniqueAnswered = 0;
    topics.forEach(function (tp) {
      totalCorrect += tp.correct;
      totalWrong += tp.wrong;
      totalUniqueAnswered += tp.answeredUnique;
    });
    var totalAnswered = totalCorrect + totalWrong;
    var overallAccuracy = totalAnswered ? Math.round((totalCorrect / totalAnswered) * 100) : 0;
    var overallProgress = Math.round((topics[0].progressPct + topics[1].progressPct + topics[2].progressPct) / 3);

    var activeTopics = topics.filter(function (tp) { return tp.totalAttempts > 0; }).sort(function (a, b) { return b.accuracy - a.accuracy; });
    var strongest = activeTopics.length ? activeTopics[0] : null;
    var weakest = activeTopics.length ? activeTopics[activeTopics.length - 1] : null;

    var wrongQuestionIds = Object.keys(state.questionStats || {}).filter(function (qid) {
      var st = state.questionStats[qid];
      return st && st.wrong > 0 && !st.resolved;
    });

    /* Personalized "What should I revise next?" recommendations */
    var recommendations = [];
    if (wrongQuestionIds.length > 0) {
      recommendations.push({
        type: 'mistakes',
        en: 'Review ' + wrongQuestionIds.length + ' unresolved incorrect question(s) in the Revision Hub.',
        ar: 'راجع ' + wrongQuestionIds.length + ' سؤالاً أخطأت فيها سابقاً في مركز المراجعة.'
      });
    }
    topics.forEach(function (tp) {
      var meta = window.MSDS_STUDY_TOPICS.find(function (x) { return x.id === tp.topicId; });
      if (!tp.topicDone) {
        recommendations.push({
          type: 'study',
          topicId: tp.topicId,
          en: 'Study and complete ' + meta.title.en + ' (' + tp.progressPct + '% complete).',
          ar: 'ذاكر وأكمل ' + meta.title.ar + ' (نسبة الإنجاز ' + tp.progressPct + '%).'
        });
      } else if (tp.totalAttempts > 0 && tp.accuracy < 80) {
        recommendations.push({
          type: 'practice',
          topicId: tp.topicId,
          en: 'Practice ' + meta.title.en + ' to raise accuracy above 80% (currently ' + tp.accuracy + '%).',
          ar: 'تدرّب على ' + meta.title.ar + ' لرفع الدقة فوق 80% (حالياً ' + tp.accuracy + '%).'
        });
      }
    });

    return {
      topics: topics,
      completedTopicsCount: (state.completedTopics || []).length,
      overallProgress: overallProgress,
      totalAnswered: totalAnswered,
      totalUniqueAnswered: totalUniqueAnswered,
      totalCorrect: totalCorrect,
      totalWrong: totalWrong,
      overallAccuracy: overallAccuracy,
      strongest: strongest,
      weakest: weakest,
      wrongQuestionIds: wrongQuestionIds,
      examHistory: state.examHistory || [],
      streak: state.streak || 0,
      dailyGoal: state.dailyGoal || 15,
      dailyCount: state.dailyCount || 0,
      recentActivity: state.recentActivity || [],
      recommendations: recommendations.slice(0, 4)
    };
  }

  return { compute: compute };
})();

window.MSDS_FLASHCARDS = (function () {
  var cards = [];
  var filterTopic = 'all';
  var idx = 0;
  var flipped = false;

  function buildDeck() {
    var base = window.MSDS_VOCAB_TERMS.map(function (v) {
      return {
        id: 'fc-' + v.id,
        topicId: v.topicId,
        frontEn: v.term,
        frontAr: v.arMeaning,
        backEn: v.enDef,
        backAr: v.arExp
      };
    });
    var concepts = [
      { id: 'fc-c1', topicId: 'topic1', frontEn: 'Data Analyst vs. Data Scientist', frontAr: 'محلل البيانات مقابل عالم البيانات', backEn: 'A Data Analyst explains current trends from historical data; a Data Scientist uses advanced algorithms to predict future outcomes.', backAr: 'محلل البيانات يفسر الحاضر من البيانات التاريخية، بينما يستخدم عالم البيانات خوارزميات متقدمة للتنبؤ بالنتائج.' },
      { id: 'fc-c2', topicId: 'topic1', frontEn: 'Data Scientist Knowledge Combination', frontAr: 'الركائز المعرفية لعالم البيانات', backEn: 'Mathematics, Statistics, and Computer Science.', backAr: 'الرياضيات والإحصاء وعلوم الحاسب.' },
      { id: 'fc-c3', topicId: 'topic1', frontEn: 'Self-Driven Car Sensors', frontAr: 'مستشعرات السيارات ذاتية القيادة', backEn: 'Lasers, radars, and cameras processed by machine learning algorithms.', backAr: 'الليزر والرادارات والكاميرات وتعالجها خوارزميات تعلم الآلة.' },
      { id: 'fc-c4', topicId: 'topic2', frontEn: '6 Phases of Data Science Life Cycle', frontAr: 'المراحل الست لدورة حياة علم البيانات', backEn: '1. Discovery -> 2. Data Preparation -> 3. Plan the Model -> 4. Build the Model -> 5. Operate the Model -> 6. Communicate the Results.', backAr: '1. الاستكشاف -> 2. تحضير البيانات -> 3. تخطيط النموذج -> 4. بناء النموذج -> 5. تشغيل النموذج -> 6. توصيل النتائج.' },
      { id: 'fc-c5', topicId: 'topic2', frontEn: 'When are Training & Testing datasets split?', frontAr: 'متى تُقسَّم بيانات التدريب والاختبار؟', backEn: 'During Phase 4 (Build the Model) — NOT during Phase 3 (Plan the Model).', backAr: 'خلال المرحلة الرابعة (بناء النموذج) وليس في مرحلة التخطيط.' },
      { id: 'fc-c6', topicId: 'topic2', frontEn: '3 Model-Building Techniques (Phase 4)', frontAr: 'تقنيات بناء النموذج الثلاث', backEn: 'Clustering, Classification, and Association.', backAr: 'التجميع (Clustering) والتصنيف (Classification) والارتباط (Association).' },
      { id: 'fc-c7', topicId: 'topic3', frontEn: 'Supervised vs. Unsupervised Learning', frontAr: 'التعلم الخاضع مقابل غير الخاضع للإشراف', backEn: 'Supervised uses labeled data for training; Unsupervised identifies patterns without labeled data.', backAr: 'الخاضع للإشراف يستخدم بيانات مصنّفة، وغير الخاضع للإشراف يكتشف الأنماط بدون تصنيف.' },
      { id: 'fc-c8', topicId: 'topic3', frontEn: 'Healthcare ML Application', frontAr: 'تطبيق تعلم الآلة في الرعاية الصحية', backEn: 'Early disease detection and tumor detection.', backAr: 'الكشف المبكر عن الأمراض واكتشاف الأورام (Tumor Detection).' }
    ];
    return base.concat(concepts);
  }

  function getFiltered() {
    var all = buildDeck();
    if (filterTopic === 'all') return all;
    return all.filter(function (c) { return c.topicId === filterTopic; });
  }

  function ensureDeck() {
    if (!cards.length) cards = getFiltered();
  }

  function setFilter(topic) {
    filterTopic = topic;
    cards = getFiltered();
    idx = 0;
    flipped = false;
  }

  function shuffle() {
    ensureDeck();
    for (var i = cards.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = cards[i]; cards[i] = cards[j]; cards[j] = tmp;
    }
    idx = 0;
    flipped = false;
  }

  function next() { ensureDeck(); if (idx < cards.length - 1) { idx++; flipped = false; } }
  function prev() { ensureDeck(); if (idx > 0) { idx--; flipped = false; } }
  function flip() { flipped = !flipped; }

  function mark(status) {
    ensureDeck();
    var c = cards[idx];
    if (!c) return;
    window.MSDS_STORAGE.update(function (s) {
      s.flashcardStatus[c.id] = status;
    });
  }

  return {
    getState: function () {
      ensureDeck();
      var st = window.MSDS_STORAGE.load().flashcardStatus || {};
      var known = 0, review = 0;
      cards.forEach(function (c) {
        if (st[c.id] === 'known') known++;
        else if (st[c.id] === 'review') review++;
      });
      return {
        filterTopic: filterTopic,
        cards: cards,
        current: cards[idx] || null,
        index: idx,
        total: cards.length,
        flipped: flipped,
        known: known,
        review: review,
        currentStatus: cards[idx] ? (st[cards[idx].id] || '') : ''
      };
    },
    setFilter: setFilter,
    shuffle: shuffle,
    next: next,
    prev: prev,
    flip: flip,
    mark: mark
  };
})();

   M<>S Data Science Platform — Practice & Matching Engine (js/quiz.js)
   Handles MCQ, True/False, Fill in the Blanks, & Interactive Matching Board.

window.MSDS_QUIZ = (function () {
  var session = null;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function normFill(s) {
    return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,;:!?]+$/g, '');
  }

  function validateFill(q, input) {
    var val = normFill(input);
    if (!val) return false;
    return (q.acceptedAnswers || []).some(function (acc) { return normFill(acc) === val; });
  }

  function buildMatchingBoard(topicId) {
    var topics = topicId === 'all' ? ['topic1', 'topic2', 'topic3'] : [topicId];
    return topics.map(function (tid) {
      var terms = window.MSDS_VOCAB_TERMS.filter(function (v) { return v.topicId === tid; });
      return {
        topicId: tid,
        terms: terms.map(function (v) { return { id: v.id, term: v.term, ar: v.arMeaning }; }),
        defs: shuffle(terms.map(function (v) { return { id: v.id, def: v.enDef, ar: v.arExp }; })),
        selectedTermId: null,
        pairs: {}, /* termId -> defId */
        validated: false
      };
    });
  }

  function start(cfg) {
    if (cfg.type === 'matching') {
      session = {
        mode: 'matching',
        cfg: Object.assign({}, cfg),
        boards: buildMatchingBoard(cfg.topic || 'all'),
        boardIdx: 0,
        finished: false
      };
      return session;
    }

    var pool = window.MSDS_QUESTIONS.filter(function (q) {
      if (cfg.onlyIds) return cfg.onlyIds.indexOf(q.id) !== -1;
      if (cfg.topic && cfg.topic !== 'all' && q.topicId !== cfg.topic) return false;
      if (cfg.type && cfg.type !== 'all' && q.type !== cfg.type) return false;
      if (cfg.type === 'all' && q.type === 'matching') return true;
      return true;
    });

    var chosen = shuffle(pool).slice(0, Math.min(cfg.count || 10, pool.length));
    session = {
      mode: cfg.viewMode || 'single',
      cfg: Object.assign({}, cfg),
      questions: chosen,
      index: 0,
      drafts: {},    /* qId -> user draft before checking */
      checked: {},   /* qId -> { answer, isCorrect } */
      showAr: {},    /* qId -> boolean */
      finished: false
    };
    return session;
  }

  function checkSingle(qId) {
    if (!session || session.mode === 'matching') return null;
    var q = session.questions.find(function (x) { return x.id === qId; });
    if (!q) return null;
    var ans = session.drafts[qId];
    if (ans === undefined || ans === null || String(ans).trim() === '') return null;

    var isCorrect = q.type === 'fill' ? validateFill(q, ans) : Number(ans) === Number(q.correctIndex);
    var displayUser = q.type === 'fill' ? String(ans) : (q.options[Number(ans)] || '—');
    session.checked[qId] = { answer: ans, displayUser: displayUser, isCorrect: isCorrect };
    window.MSDS_STORAGE.recordAnswer(q.id, isCorrect, displayUser);
    return session.checked[qId];
  }

  function finishPractice() {
    if (!session) return;
    if (session.mode !== 'matching') {
      session.questions.forEach(function (q) {
        if (!session.checked[q.id] && session.drafts[q.id] !== undefined && String(session.drafts[q.id]).trim() !== '') {
          checkSingle(q.id);
        }
      });
    }
    session.finished = true;
    var summary = getScore();
    window.MSDS_STORAGE.update(function (s) {
      s.practiceHistory.unshift({ ts: Date.now(), correct: summary.correct, total: summary.total, pct: summary.pct });
      window.MSDS_STORAGE.logActivity(s, 'Practice Session', 'جلسة تدريب', summary.correct + '/' + summary.total + ' (' + summary.pct + '%)');
    });
    return summary;
  }

  function getScore() {
    if (!session) return { correct: 0, total: 0, pct: 0, wrongIds: [] };
    if (session.mode === 'matching') {
      var c = 0, tot = 0, wIds = [];
      session.boards.forEach(function (b) {
        b.terms.forEach(function (t) {
          tot += 1;
          if (b.pairs[t.id] === t.id) c += 1;
          else wIds.push('match-' + t.id);
        });
      });
      return { correct: c, total: tot, pct: tot ? Math.round((c / tot) * 100) : 0, wrongIds: wIds };
    }
    var correct = 0, wrongIds = [];
    session.questions.forEach(function (q) {
      var res = session.checked[q.id];
      if (res && res.isCorrect) correct += 1;
      else wrongIds.push(q.id);
    });
    var total = session.questions.length;
    return { correct: correct, total: total, pct: total ? Math.round((correct / total) * 100) : 0, wrongIds: wrongIds };
  }

  function validateMatchingBoard(boardIdx) {
    if (!session || session.mode !== 'matching') return;
    var b = session.boards[boardIdx];
    if (!b) return;
    b.validated = true;
    b.terms.forEach(function (t) {
      var ok = b.pairs[t.id] === t.id;
      var matchedDef = b.defs.find(function (d) { return d.id === b.pairs[t.id]; });
      window.MSDS_STORAGE.recordAnswer('match-' + t.id, ok, matchedDef ? matchedDef.def : '—');
    });
  }

  return {
    shuffle: shuffle,
    validateFill: validateFill,
    start: start,
    checkSingle: checkSingle,
    finishPractice: finishPractice,
    getScore: getScore,
    validateMatchingBoard: validateMatchingBoard,
    getSession: function () { return session; },
    clear: function () { session = null; }
  };
})();

/* ==========================================================================
   M<>S Data Science Platform — Formal Examination Engine (js/exams.js)
   Features: Topic & Comprehensive exams, random selection, timer with auto-submit,
   zero answer disclosure while active, confirmation modal, saved history & review.
   ========================================================================== */

window.MSDS_EXAMS = (function () {
  var active = null;
  var viewingHistoryAttempt = null;
  var timerId = null;

  function clearTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  function start(cfg, onTick, onExpire) {
    clearTimer();
    viewingHistoryAttempt = null;
    var pool = window.MSDS_QUESTIONS.filter(function (q) {
      if (cfg.onlyIds) return cfg.onlyIds.indexOf(q.id) !== -1;
      if (cfg.scope && cfg.scope !== 'all' && q.topicId !== cfg.scope) return false;
      return true;
    });
    if (!pool.length) return null;

    var chosen = window.MSDS_QUIZ.shuffle(pool).slice(0, Math.min(cfg.count || 20, pool.length));
    var dur = (cfg.timerMin || 0) * 60;
    active = {
      id: 'exam-' + Date.now(),
      cfg: Object.assign({}, cfg),
      questions: chosen,
      index: 0,
      answers: {},
      startedAt: Date.now(),
      durationSec: dur,
      remainingSec: dur,
      submitted: false,
      result: null
    };

    if (dur > 0) {
      timerId = setInterval(function () {
        if (!active || active.submitted) { clearTimer(); return; }
        active.remainingSec -= 1;
        if (onTick) onTick(active.remainingSec);
        if (active.remainingSec <= 0) {
          clearTimer();
          submit();
          if (onExpire) onExpire();
        }
      }, 1000);
    }
    return active;
  }

  function submit() {
    if (!active || active.submitted) return active ? active.result : null;
    clearTimer();
    active.submitted = true;
    var elapsed = Math.max(1, Math.round((Date.now() - active.startedAt) / 1000));
    var correct = 0, wrong = 0, review = [];

    active.questions.forEach(function (q) {
      var ans = active.answers[q.id];
      var hasAns = ans !== undefined && ans !== null && String(ans).trim() !== '';
      var isOk = false;
      if (hasAns) {
        isOk = q.type === 'fill' ? window.MSDS_QUIZ.validateFill(q, ans) : Number(ans) === Number(q.correctIndex);
      }
      if (isOk) correct += 1; else wrong += 1;

      var userText = !hasAns ? '—' : (q.type === 'fill' ? String(ans) : (q.options[Number(ans)] || '—'));
      var corrText = q.type === 'fill' ? q.displayAnswer : q.options[q.correctIndex];

      window.MSDS_STORAGE.recordAnswer(q.id, isOk, userText);
      review.push({
        qId: q.id,
        topicId: q.topicId,
        question: q.question,
        questionAr: q.questionAr,
        userAnswer: userText,
        correctAnswer: corrText,
        isCorrect: isOk,
        expEn: q.expEn,
        expAr: q.expAr
      });
    });

    var total = active.questions.length;
    var pct = total ? Math.round((correct / total) * 100) : 0;
    var record = {
      id: active.id,
      date: Date.now(),
      scope: active.cfg.scope || 'all',
      total: total,
      correct: correct,
      wrong: wrong,
      percentage: pct,
      elapsedSec: elapsed,
      wrongIds: review.filter(function (r) { return !r.isCorrect; }).map(function (r) { return r.qId; }),
      review: review
    };

    window.MSDS_STORAGE.update(function (s) {
      s.examHistory = s.examHistory || [];
      s.examHistory.unshift(record);
      window.MSDS_STORAGE.logActivity(s, 'Exam Completed (' + record.scope + ')', 'إتمام امتحان (' + record.scope + ')', record.correct + '/' + record.total + ' (' + record.percentage + '%)');
    });

    active.result = record;
    return record;
  }

  return {
    start: start,
    submit: submit,
    clearTimer: clearTimer,
    getActive: function () { return active; },
    clearActive: function () { clearTimer(); active = null; viewingHistoryAttempt = null; },
    setReviewAttempt: function (att) { viewingHistoryAttempt = att; },
    getReviewAttempt: function () { return viewingHistoryAttempt; }
  };
})();

    var tp = window.MSDS_STUDY_TOPICS.find(function (x) { return x.id === stateUI.studyTopic; }) || window.MSDS_STUDY_TOPICS[0];
    var isDone = (st.completedTopics || []).indexOf(tp.id) !== -1;
    var isBook = (st.bookmarkedExplanations || []).indexOf(tp.id) !== -1;

    root.innerHTML =
      '<div class="page-head">' +
        '<div class="eyebrow">M&lt;&gt;S · ' + t('navStudy') + '</div>' +
        '<h1 class="page-title">' + t('studyTitle') + '</h1>' +
        '<p class="page-sub">' + t('studySubtitle') + '</p>' +
      '</div>' +

      '<div class="tabs-row">' +
        window.MSDS_STUDY_TOPICS.map(function (item) {
          return '<button class="tab-btn ' + (item.id === tp.id ? 'active' : '') + '" data-st-tab="' + item.id + '">Topic ' + item.number + ': ' + esc(item.title[lang]) + '</button>';
        }).join('') +
      '</div>' +

      '<article class="card" style="display:flex;flex-direction:column;gap:18px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">' +
          '<div><div class="eyebrow">TOPIC ' + tp.number + '</div><h2 style="margin:4px 0 0;font-size:1.45rem;">' + esc(tp.title[lang]) + '</h2></div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<button class="btn btn-sm ' + (isBook ? 'btn-primary' : 'btn-secondary') + '" id="btn-bm-exp">' + (isBook ? '&#9733; ' + t('bookmarked') : '&#9734; ' + t('bookmarkExp')) + '</button>' +
            '<button class="btn btn-sm ' + (isDone ? 'btn-secondary' : 'btn-primary') + '" id="btn-done-topic">' + (isDone ? '&#10003; ' + t('topicCompleted') : t('markTopicDone')) + '</button>' +
          '</div>' +
        '</div>' +

        renderSvg(tp.diagram) +

        '<div><h3 style="margin:0 0 6px;color:var(--accent);">' + t('secIntro') + '</h3><p style="margin:0;">' + esc(tp.introduction[lang]) + '</p></div>' +

        '<div><h3 style="margin:0 0 8px;color:var(--accent);">' + t('secDefs') + '</h3>' +
          '<div class="vocab-grid">' + tp.definitions.map(function (d) {
            return '<div class="card-subtle"><strong>' + esc(d.term) + ' (' + esc(d.ar) + ')</strong><p style="margin:6px 0 0;font-size:0.88rem;">' + esc(lang === 'ar' ? d.defAr : d.defEn) + '</p></div>';
          }).join('') + '</div></div>' +

        '<div><h3 style="margin:0 0 8px;color:var(--accent);">' + t('secDetail') + '</h3>' +
          tp.detailed[lang].map(function (para) { return '<p style="margin:0 0 10px;">' + esc(para) + '</p>'; }).join('') + '</div>' +

        '<div><h3 style="margin:0 0 8px;color:var(--accent);">' + t('secTerms') + '</h3>' +
          '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + tp.terminology.map(function (tm) { return '<span class="badge badge-muted">' + esc(tm) + '</span>'; }).join('') + '</div></div>' +

        '<div><h3 style="margin:0 0 8px;color:var(--accent);">' + t('secExamples') + '</h3><ul style="margin:0;padding-inline-start:20px;">' +
          tp.examples[lang].map(function (e) { return '<li style="margin-bottom:6px;">' + esc(e) + '</li>'; }).join('') + '</ul></div>' +

        '<div><h3 style="margin:0 0 8px;color:var(--accent);">' + t('secKeyPoints') + '</h3><ul style="margin:0;padding-inline-start:20px;">' +
          tp.keyPoints[lang].map(function (k) { return '<li style="margin-bottom:6px;">' + esc(k) + '</li>'; }).join('') + '</ul></div>' +

        '<div class="card-subtle"><strong>' + t('secSummary') + ':</strong> ' + esc(tp.summary[lang]) + '</div>' +

        '<div><h3 style="margin:0 0 8px;color:var(--err-color);">' + t('secMistakes') + '</h3><ul style="margin:0;padding-inline-start:20px;">' +
          tp.commonMistakes[lang].map(function (m) { return '<li style="margin-bottom:6px;">' + esc(m) + '</li>'; }).join('') + '</ul></div>' +
      '</article>';

    root.querySelectorAll('[data-st-tab]').forEach(function (b) {
      b.addEventListener('click', function () {
        stateUI.studyTopic = b.getAttribute('data-st-tab');
        window.MSDS_STORAGE.update(function (s) { s.lastTopicId = stateUI.studyTopic; });
        renderStudy();
      });
    });
    document.getElementById('btn-done-topic').addEventListener('click', function () {
      window.MSDS_STORAGE.update(function (s) {
        var i = s.completedTopics.indexOf(tp.id);
        if (i === -1) {
          s.completedTopics.push(tp.id);
          window.MSDS_STORAGE.logActivity(s, 'Completed ' + tp.title.en, 'إكمال ' + tp.title.ar, '100%');
        } else s.completedTopics.splice(i, 1);
      });
      renderStudy();
      toast(isDone ? 'Unmarked' : t('topicCompleted'));
    });
    document.getElementById('btn-bm-exp').addEventListener('click', function () {
      window.MSDS_STORAGE.update(function (s) {
        var i = s.bookmarkedExplanations.indexOf(tp.id);
        if (i === -1) s.bookmarkedExplanations.push(tp.id); else s.bookmarkedExplanations.splice(i, 1);
      });
      renderStudy();
    });
  }

  /* ==================== PAGE C: VOCABULARY ==================== */
  function renderVocabulary() {
    var root = document.getElementById('page-vocabulary');
    if (!root) return;
    var t = window.MSDS_I18N.t;
    var st = window.MSDS_STORAGE.load();
    var terms = stateUI.vocabOrder || window.MSDS_VOCAB_TERMS.slice();

    var filtered = terms.filter(function (v) {
      if (stateUI.vocabTopic !== 'all' && v.topicId !== stateUI.vocabTopic) return false;
      if (stateUI.vocabSearch.trim()) {
        var q = stateUI.vocabSearch.trim().toLowerCase();
        return v.term.toLowerCase().indexOf(q) !== -1 || v.arMeaning.indexOf(stateUI.vocabSearch.trim()) !== -1 || v.enDef.toLowerCase().indexOf(q) !== -1;
      }
      return true;
    });

    root.innerHTML =
      '<div class="page-head">' +
        '<div class="eyebrow">M&lt;&gt;S · ' + t('navVocab') + '</div>' +
        '<h1 class="page-title">' + t('vocabTitle') + '</h1>' +
        '<p class="page-sub">' + t('vocabSubtitle') + '</p>' +
      '</div>' +

      '<div class="config-grid" style="margin-bottom:16px;">' +
        '<input type="search" id="voc-search" class="input" value="' + esc(stateUI.vocabSearch) + '" placeholder="' + esc(t('searchVocab')) + '">' +
        '<select id="voc-topic" class="select">' +
          '<option value="all"' + (stateUI.vocabTopic === 'all' ? ' selected' : '') + '>' + t('allTopics') + '</option>' +
          '<option value="topic1"' + (stateUI.vocabTopic === 'topic1' ? ' selected' : '') + '>Topic 1</option>' +
          '<option value="topic2"' + (stateUI.vocabTopic === 'topic2' ? ' selected' : '') + '>Topic 2</option>' +
          '<option value="topic3"' + (stateUI.vocabTopic === 'topic3' ? ' selected' : '') + '>Topic 3</option>' +
        '</select>' +
        '<button class="btn btn-secondary" id="voc-shuffle">' + t('shuffle') + '</button>' +
      '</div>' +

      '<div class="vocab-grid">' + filtered.map(function (v) {
        var flipped = !!stateUI.vocabFlipped[v.id];
        var ok = (st.vocabUnderstood || []).indexOf(v.id) !== -1;
        var fav = (st.vocabFavorites || []).indexOf(v.id) !== -1;
        return '<div class="flip-scene">' +
          '<div class="flip-card ' + (flipped ? 'flipped' : '') + '">' +
            '<div class="flip-face">' +
              '<div>' +
                '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
                  '<span class="badge badge-muted">' + v.topicId.toUpperCase() + '</span>' +
                  (ok ? '<span class="badge badge-green">&#10003; ' + t('understood') + '</span>' : '') +
                '</div>' +
                '<div style="font-size:1.15rem;font-weight:800;">' + esc(v.term) + '</div>' +
                '<div style="font-size:1rem;font-weight:700;color:var(--accent);margin-top:4px;">' + esc(v.arMeaning) + '</div>' +
                '<p style="margin:10px 0 0;font-size:0.86rem;color:var(--text-muted);">' + esc(v.enDef) + '</p>' +
              '</div>' +
              '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;">' +
                '<button class="btn btn-primary btn-sm" data-vflip="' + v.id + '">' + t('flipCard') + '</button>' +
                '<button class="btn btn-secondary btn-sm" data-vok="' + v.id + '">' + (ok ? t('understood') : t('markUnderstood')) + '</button>' +
                '<button class="btn btn-secondary btn-sm" data-vfav="' + v.id + '">' + (fav ? '&#9733;' : '&#9734;') + '</button>' +
              '</div>' +
            '</div>' +
            '<div class="flip-face flip-back">' +
              '<div>' +
                '<div class="eyebrow">' + esc(v.term) + '</div>' +
                '<p style="margin:8px 0;font-size:0.9rem;">' + esc(v.arExp) + '</p>' +
                '<p style="margin:0;font-size:0.84rem;font-style:italic;color:var(--text-muted);">"' + esc(v.example) + '"</p>' +
              '</div>' +
              '<button class="btn btn-secondary btn-sm" style="align-self:flex-start;" data-vflip="' + v.id + '">' + t('flipCard') + '</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>';

    var vs = document.getElementById('voc-search');
    if (vs) vs.addEventListener('input', function () {
      stateUI.vocabSearch = vs.value;
      renderVocabulary();
      var n = document.getElementById('voc-search');
      if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    });
    document.getElementById('voc-topic').addEventListener('change', function (e) { stateUI.vocabTopic = e.target.value; renderVocabulary(); });
    document.getElementById('voc-shuffle').addEventListener('click', function () { stateUI.vocabOrder = window.MSDS_QUIZ.shuffle(window.MSDS_VOCAB_TERMS); renderVocabulary(); });
    root.querySelectorAll('[data-vflip]').forEach(function (b) { b.addEventListener('click', function () { var id = b.getAttribute('data-vflip'); stateUI.vocabFlipped[id] = !stateUI.vocabFlipped[id]; renderVocabulary(); }); });
    root.querySelectorAll('[data-vok]').forEach(function (b) { b.addEventListener('click', function () { var id = b.getAttribute('data-vok'); window.MSDS_STORAGE.update(function (s) { var i = s.vocabUnderstood.indexOf(id); if (i === -1) s.vocabUnderstood.push(id); else s.vocabUnderstood.splice(i, 1); }); renderVocabulary(); }); });
    root.querySelectorAll('[data-vfav]').forEach(function (b) { b.addEventListener('click', function () { var id = b.getAttribute('data-vfav'); window.MSDS_STORAGE.update(function (s) { var i = s.vocabFavorites.indexOf(id); if (i === -1) s.vocabFavorites.push(id); else s.vocabFavorites.splice(i, 1); }); renderVocabulary(); }); });
  }

  /* ==================== PAGE D: PRACTICE ==================== */
  function renderPractice() {
    var root = document.getElementById('page-practice');
    if (!root) return;
    var t = window.MSDS_I18N.t;
    var lang = window.MSDS_I18N.getLang();
    var sess = window.MSDS_QUIZ.getSession();

    if (!sess) {
      root.innerHTML =
        '<div class="page-head">' +
          '<div class="eyebrow">M&lt;&gt;S · ' + t('navPractice') + '</div>' +
          '<h1 class="page-title">' + t('practiceTitle') + '</h1>' +
          '<p class="page-sub">' + t('practiceSubtitle') + '</p>' +
        '</div>' +
        '<div class="card">' +
          '<div class="config-grid">' +
            '<div><label style="font-size:0.82rem;font-weight:700;display:block;margin-bottom:6px;">' + t('selectTopic') + '</label>' +
              '<select id="pr-topic" class="select"><option value="all">' + t('allTopics') + '</option><option value="topic1">Topic 1</option><option value="topic2">Topic 2</option><option value="topic3">Topic 3</option></select></div>' +
            '<div><label style="font-size:0.82rem;font-weight:700;display:block;margin-bottom:6px;">' + t('selectType') + '</label>' +
              '<select id="pr-type" class="select"><option value="all">' + t('typeAll') + '</option><option value="mcq">' + t('typeMcq') + '</option><option value="tf">' + t('typeTf') + '</option><option value="matching">' + t('typeMatch') + '</option><option value="fill">' + t('typeFill') + '</option></select></div>' +
            '<div><label style="font-size:0.82rem;font-weight:700;display:block;margin-bottom:6px;">' + t('questionCount') + '</label>' +
              '<select id="pr-count" class="select"><option value="5">5</option><option value="10" selected>10</option><option value="15">15</option><option value="30">30</option><option value="75">All (75)</option></select></div>' +
            '<div><label style="font-size:0.82rem;font-weight:700;display:block;margin-bottom:6px;">' + t('viewMode') + '</label>' +
              '<select id="pr-view" class="select"><option value="single">' + t('modeSingle') + '</option><option value="list">' + t('modeList') + '</option></select></div>' +
          '</div>' +
          '<div style="margin-top:16px;"><button class="btn btn-primary" id="btn-start-pr">' + t('startPractice') + '</button></div>' +
        '</div>';

      document.getElementById('btn-start-pr').addEventListener('click', function () {
        window.MSDS_QUIZ.start({
          topic: document.getElementById('pr-topic').value,
          type: document.getElementById('pr-type').value,
          count: Number(document.getElementById('pr-count').value),
          viewMode: document.getElementById('pr-view').value
        });
        renderPractice();
      });
      return;
    }

    /* Finished Practice Summary */
    if (sess.finished) {
      var sc = window.MSDS_QUIZ.getScore();
      root.innerHTML =
        '<div class="card">' +
          '<div class="eyebrow">' + t('navPractice') + '</div>' +
          '<h2 class="page-title">' + sc.correct + ' / ' + sc.total + ' (' + sc.pct + '%)</h2>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;">' +
            (sc.wrongIds.length ? '<button class="btn btn-primary" id="btn-pr-retry">' + t('retryWrong') + ' (' + sc.wrongIds.length + ')</button>' : '') +
            '<button class="btn btn-secondary" id="btn-pr-new">' + t('newSession') + '</button>' +
          '</div>' +
        '</div>';
      var rBtn = document.getElementById('btn-pr-retry');
      if (rBtn) rBtn.addEventListener('click', function () {
        window.MSDS_QUIZ.start({ onlyIds: sc.wrongIds, count: sc.wrongIds.length, viewMode: 'single' });
        renderPractice();
      });
      document.getElementById('btn-pr-new').addEventListener('click', function () { window.MSDS_QUIZ.clear(); renderPractice(); });
      return;
    }

    /* Interactive Touch-Friendly Matching Board */
    if (sess.mode === 'matching') {
      var b = sess.boards[sess.boardIdx];
      var pairedCount = Object.keys(b.pairs).length;
      root.innerHTML =
        '<div class="card">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;">' +
            '<strong>' + t('typeMatch') + ' — ' + b.topicId.toUpperCase() + ' (' + (sess.boardIdx + 1) + '/' + sess.boards.length + ')</strong>' +
            '<span class="badge badge-muted">' + pairedCount + '/' + b.terms.length + '</span>' +
          '</div>' +
          '<p style="margin:0;font-size:0.86rem;color:var(--text-muted);">' + t('matchingInstr') + '</p>' +
          '<div class="match-board">' +
            '<div class="match-col">' + b.terms.map(function (tm, i) {
              var cls = 'match-item';
              if (b.selectedTermId === tm.id) cls += ' picking';
              if (b.validated) cls += (b.pairs[tm.id] === tm.id ? ' ok' : ' err');
              else if (b.pairs[tm.id]) cls += ' paired';
              var badge = b.pairs[tm.id] ? ' <span class="badge badge-green">#' + (b.defs.findIndex(function (d) { return d.id === b.pairs[tm.id]; }) + 1) + '</span>' : '';
              return '<button class="' + cls + '" data-m-term="' + tm.id + '"><strong>' + (i + 1) + '. ' + esc(tm.term) + '</strong>' + (lang === 'ar' ? ' — ' + esc(tm.ar) : '') + badge + '</button>';
            }).join('') + '</div>' +
            '<div class="match-col">' + b.defs.map(function (df, i) {
              var cls = 'match-item';
              var assignedTerm = Object.keys(b.pairs).find(function (tid) { return b.pairs[tid] === df.id; });
              if (b.validated) cls += (assignedTerm === df.id ? ' ok' : ' err');
              else if (assignedTerm) cls += ' paired';
              return '<button class="' + cls + '" data-m-def="' + df.id + '"><strong>#' + (i + 1) + '</strong> ' + esc(df.def) + (lang === 'ar' ? '<div style="font-size:0.82rem;color:var(--text-muted);margin-top:4px;">' + esc(df.ar) + '</div>' : '') + '</button>';
            }).join('') + '</div>' +
          '</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;">' +
            (!b.validated ? '<button class="btn btn-primary" id="btn-val-match">' + t('validateMatches') + '</button>' : '') +
            '<button class="btn btn-secondary" id="btn-rst-match">' + t('resetMatches') + '</button>' +
            (sess.boardIdx < sess.boards.length - 1 ? '<button class="btn btn-primary" id="btn-next-board">' + t('nextBtn') + ' &rarr;</button>' : '<button class="btn btn-primary" id="btn-fin-pr">' + t('finishPractice') + '</button>') +
          '</div>' +
        '</div>';

      root.querySelectorAll('[data-m-term]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (b.validated) return;
          b.selectedTermId = btn.getAttribute('data-m-term');
          renderPractice();
        });
      });
      root.querySelectorAll('[data-m-def]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (b.validated || !b.selectedTermId) return;
          var defId = btn.getAttribute('data-m-def');
          Object.keys(b.pairs).forEach(function (k) { if (b.pairs[k] === defId) delete b.pairs[k]; });
          b.pairs[b.selectedTermId] = defId;
          b.selectedTermId = null;
          renderPractice();
        });
      });
      var vm = document.getElementById('btn-val-match');
      if (vm) vm.addEventListener('click', function () { window.MSDS_QUIZ.validateMatchingBoard(sess.boardIdx); renderPractice(); });
      document.getElementById('btn-rst-match').addEventListener('click', function () { b.pairs = {}; b.validated = false; b.selectedTermId = null; renderPractice(); });
      var nb = document.getElementById('btn-next-board');
      if (nb) nb.addEventListener('click', function () { sess.boardIdx += 1; renderPractice(); });
      var fp = document.getElementById('btn-fin-pr');
      if (fp) fp.addEventListener('click', function () { window.MSDS_QUIZ.finishPractice(); renderPractice(); });
      return;
    }

    /* Single or List Practice Questions */
    var listToRender = sess.mode === 'list' ? sess.questions : [sess.questions[sess.index]];
    var bms = window.MSDS_STORAGE.load().bookmarkedQuestions || [];

    var cardsHtml = listToRender.map(function (q, localIdx) {
      var globalIdx = sess.mode === 'list' ? localIdx : sess.index;
      var chk = sess.checked[q.id];
      var dr = sess.drafts[q.id];
      var isBm = bms.indexOf(q.id) !== -1;
      var showAr = lang === 'ar' || !!sess.showAr[q.id];

      var body = '';
      if (q.type === 'fill') {
        body = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">' +
          '<input class="input" style="max-width:340px;" data-pr-fill="' + q.id + '" value="' + esc(dr || '') + '" placeholder="' + esc(t('fillPlaceholder')) + '" ' + (chk ? 'disabled' : '') + '>' +
          (!chk ? '<button class="btn btn-primary" data-pr-check="' + q.id + '">' + t('checkAnswer') + '</button>' : '') +
        '</div>';
      } else {
        body = '<div class="opt-list">' + q.options.map(function (opt, oi) {
          var cls = '';
          if (chk) {
            if (oi === q.correctIndex) cls = ' ok';
            else if (Number(chk.answer) === oi) cls = ' err';
          } else if (dr !== undefined && Number(dr) === oi) cls = ' selected';
          return '<button class="opt-btn' + cls + '" data-pr-opt="' + q.id + '" data-oi="' + oi + '" ' + (chk ? 'disabled' : '') + '>' +
            '<span class="opt-key">' + String.fromCharCode(65 + oi) + '</span>' +
            '<span>' + esc(opt) + (showAr && q.optionsAr ? '<div style="font-size:0.82rem;color:var(--text-muted);">' + esc(q.optionsAr[oi]) + '</div>' : '') + '</span>' +
          '</button>';
        }).join('') + '</div>' +
        (!chk ? '<div style="margin-top:12px;"><button class="btn btn-primary btn-sm" data-pr-check="' + q.id + '" ' + (dr === undefined ? 'disabled' : '') + '>' + t('checkAnswer') + '</button></div>' : '');
      }

      var fb = '';
      if (chk) {
        var corrDisp = q.type === 'fill' ? q.displayAnswer : q.options[q.correctIndex];
        fb = '<div class="fb-box ' + (chk.isCorrect ? 'ok' : 'err') + '">' +
          '<strong>' + (chk.isCorrect ? t('correct') : t('incorrect') + ' — ' + t('correctAnsLabel') + ': ' + esc(corrDisp)) + '</strong>' +
          '<div style="margin-top:4px;">' + esc(lang === 'ar' ? q.expAr : q.expEn) + '</div>' +
        '</div>';
      }

      return '<div class="card" style="margin-bottom:14px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;">' +
          '<span class="badge badge-muted">#' + (globalIdx + 1) + '/' + sess.questions.length + ' · ' + esc(q.topicId.toUpperCase()) + ' · ' + esc(q.source) + '</span>' +
          '<div style="display:flex;gap:6px;">' +
            '<button class="btn btn-secondary btn-sm" data-pr-ar="' + q.id + '">' + t('showArTrans') + '</button>' +
            '<button class="btn btn-secondary btn-sm" data-pr-bm="' + q.id + '">' + (isBm ? '&#9733; ' + t('savedQuestion') : '&#9734; ' + t('saveQuestion')) + '</button>' +
          '</div>' +
        '</div>' +
        '<p style="margin:0;font-weight:700;font-size:1.02rem;">' + esc(q.question) + '</p>' +
        (showAr ? '<p style="margin:6px 0 0;font-size:0.88rem;color:var(--text-muted);">' + esc(q.questionAr) + '</p>' : '') +
        body + fb +
      '</div>';
    }).join('');

    var progPct = Math.round(((Object.keys(sess.checked).length) / Math.max(1, sess.questions.length)) * 100);
    root.innerHTML =
      '<div class="progress-track" style="margin-bottom:14px;"><div class="progress-fill" style="width:' + progPct + '%;"></div></div>' +
      cardsHtml +
      '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;">' +
        (sess.mode === 'single' ? '<button class="btn btn-secondary" id="pr-prev" ' + (sess.index === 0 ? 'disabled' : '') + '>&larr; ' + t('prevBtn') + '</button>' : '<span></span>') +
        '<div style="display:flex;gap:8px;">' +
          (sess.mode === 'single' && sess.index < sess.questions.length - 1 ? '<button class="btn btn-secondary" id="pr-next">' + t('nextBtn') + ' &rarr;</button>' : '') +
          '<button class="btn btn-primary" id="pr-finish">' + t('finishPractice') + '</button>' +
        '</div>' +
      '</div>';

    root.querySelectorAll('[data-pr-opt]').forEach(function (b) {
      b.addEventListener('click', function () {
        sess.drafts[b.getAttribute('data-pr-opt')] = Number(b.getAttribute('data-oi'));
        renderPractice();
      });
    });
    root.querySelectorAll('[data-pr-fill]').forEach(function (inp) {
      inp.addEventListener('input', function () { sess.drafts[inp.getAttribute('data-pr-fill')] = inp.value; });
    });
    root.querySelectorAll('[data-pr-check]').forEach(function (b) {
      b.addEventListener('click', function () { window.MSDS_QUIZ.checkSingle(b.getAttribute('data-pr-check')); renderPractice(); });
    });
    root.querySelectorAll('[data-pr-ar]').forEach(function (b) {
      b.addEventListener('click', function () { var id = b.getAttribute('data-pr-ar'); sess.showAr[id] = !sess.showAr[id]; renderPractice(); });
    });
    root.querySelectorAll('[data-pr-bm]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-pr-bm');
        window.MSDS_STORAGE.update(function (s) { var i = s.bookmarkedQuestions.indexOf(id); if (i === -1) s.bookmarkedQuestions.push(id); else s.bookmarkedQuestions.splice(i, 1); });
        renderPractice();
      });
    });
    var pp = document.getElementById('pr-prev');
    if (pp) pp.addEventListener('click', function () { sess.index -= 1; renderPractice(); });
    var pn = document.getElementById('pr-next');
    if (pn) pn.addEventListener('click', function () { sess.index += 1; renderPractice(); });
    document.getElementById('pr-finish').addEventListener('click', function () { window.MSDS_QUIZ.finishPractice(); renderPractice(); });
  }

  /* ==================== PAGE F: EXAMS ==================== */
  function renderExams() {
    var root = document.getElementById('page-exams');
    if (!root) return;
    var t = window.MSDS_I18N.t;
    var lang = window.MSDS_I18N.getLang();
    var act = window.MSDS_EXAMS.getActive();
    var revHist = window.MSDS_EXAMS.getReviewAttempt();

    /* Reviewing a submitted or historical exam */
    if ((act && act.submitted && act.result) || revHist) {
      var res = revHist || act.result;
      root.innerHTML =
        '<div class="card" style="margin-bottom:18px;">' +
          '<div class="eyebrow">M&lt;&gt;S · ' + t('navExams') + '</div>' +
          '<h1 class="page-title">' + res.correct + ' / ' + res.total + ' (' + res.percentage + '%)</h1>' +
          '<p class="page-sub">' + t('correct') + ': ' + res.correct + ' · ' + t('incorrect') + ': ' + res.wrong + ' · ' + fmtTime(res.elapsedSec) + '</p>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;">' +
            (res.wrongIds && res.wrongIds.length ? '<button class="btn btn-primary" id="ex-retry-wrong">' + t('retryWrong') + '</button>' : '') +
            '<button class="btn btn-secondary" id="ex-back-lobby">' + t('navExams') + '</button>' +
          '</div>' +
        '</div>' +
        res.review.map(function (r, idx) {
          return '<div class="card" style="margin-bottom:10px;">' +
            '<span class="badge ' + (r.isCorrect ? 'badge-green' : 'badge-err') + '">' + (r.isCorrect ? t('correct') : t('incorrect')) + '</span>' +
            '<p style="margin:8px 0 4px;font-weight:700;">' + (idx + 1) + '. ' + esc(r.question) + '</p>' +
            (lang === 'ar' ? '<p style="margin:0 0 6px;font-size:0.84rem;color:var(--text-muted);">' + esc(r.questionAr) + '</p>' : '') +
            '<div style="font-size:0.86rem;"><strong>' + t('yourAnsLabel') + ':</strong> ' + esc(r.userAnswer) + '</div>' +
            '<div style="font-size:0.86rem;color:var(--ok-color);"><strong>' + t('correctAnsLabel') + ':</strong> ' + esc(r.correctAnswer) + '</div>' +
            '<div style="font-size:0.84rem;color:var(--text-muted);margin-top:4px;">' + esc(lang === 'ar' ? r.expAr : r.expEn) + '</div>' +
          '</div>';
        }).join('');

      var rw = document.getElementById('ex-retry-wrong');
      if (rw) rw.addEventListener('click', function () {
        window.MSDS_EXAMS.start({ scope: 'retry', onlyIds: res.wrongIds, count: res.wrongIds.length, timerMin: 0 }, tickUi, renderExams);
        renderExams();
      });
      document.getElementById('ex-back-lobby').addEventListener('click', function () { window.MSDS_EXAMS.clearActive(); renderExams(); });
      return;
    }

    /* Active Distraction-Free Exam */
    if (act && !act.submitted) {
      var q = act.questions[act.index];
      var ans = act.answers[q.id];
      var pct = Math.round(((act.index + 1) / act.questions.length) * 100);
      root.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;">' +
          '<strong>' + (act.index + 1) + ' / ' + act.questions.length + '</strong>' +
          (act.durationSec > 0 ? '<span class="timer-pill" id="exam-timer-val">' + fmtTime(act.remainingSec) + '</span>' : '') +
        '</div>' +
        '<div class="progress-track" style="margin-bottom:16px;"><div class="progress-fill" style="width:' + pct + '%;"></div></div>' +
        '<div class="card" style="margin-bottom:16px;">' +
          '<span class="badge badge-muted">' + q.topicId.toUpperCase() + ' · ' + esc(q.type.toUpperCase()) + '</span>' +
          '<p style="margin:10px 0 4px;font-weight:700;font-size:1.06rem;">' + esc(q.question) + '</p>' +
          (lang === 'ar' ? '<p style="margin:0 0 10px;font-size:0.86rem;color:var(--text-muted);">' + esc(q.questionAr) + '</p>' : '') +
          (q.type === 'fill'
            ? '<input id="ex-fill-inp" class="input" value="' + esc(ans || '') + '" placeholder="' + esc(t('fillPlaceholder')) + '">'
            : '<div class="opt-list">' + q.options.map(function (o, oi) {
                return '<button class="opt-btn ' + (ans !== undefined && Number(ans) === oi ? 'selected' : '') + '" data-ex-opt="' + oi + '"><span class="opt-key">' + String.fromCharCode(65 + oi) + '</span><span>' + esc(o) + (lang === 'ar' && q.optionsAr ? '<div style="font-size:0.82rem;color:var(--text-muted);">' + esc(q.optionsAr[oi]) + '</div>' : '') + '</span></button>';
              }).join('') + '</div>') +
        '</div>' +
        '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;">' +
          '<button class="btn btn-secondary" id="ex-prev" ' + (act.index === 0 ? 'disabled' : '') + '>&larr; ' + t('prevBtn') + '</button>' +
          '<div style="display:flex;gap:8px;">' +
            (act.index < act.questions.length - 1 ? '<button class="btn btn-secondary" id="ex-next">' + t('nextBtn') + ' &rarr;</button>' : '') +
            '<button class="btn btn-primary" id="ex-submit-ask">' + t('submitExam') + '</button>' +
          '</div>' +
        '</div>';

      root.querySelectorAll('[data-ex-opt]').forEach(function (b) { b.addEventListener('click', function () { act.answers[q.id] = Number(b.getAttribute('data-ex-opt')); renderExams(); }); });
      var ef = document.getElementById('ex-fill-inp');
      if (ef) ef.addEventListener('input', function () { act.answers[q.id] = ef.value; });
      document.getElementById('ex-prev').addEventListener('click', function () { act.index -= 1; renderExams(); });
      var en = document.getElementById('ex-next'); if (en) en.addEventListener('click', function () { act.index += 1; renderExams(); });
      document.getElementById('ex-submit-ask').addEventListener('click', function () { openConfirmModal(); });
      return;
    }

    /* Exam Lobby + Saved History */
    var hist = window.MSDS_STORAGE.load().examHistory || [];
    root.innerHTML =
      '<div class="page-head">' +
        '<div class="eyebrow">M&lt;&gt;S · ' + t('navExams') + '</div>' +
        '<h1 class="page-title">' + t('examsTitle') + '</h1>' +
        '<p class="page-sub">' + t('examsSubtitle') + '</p>' +
      '</div>' +
      '<div class="card" style="margin-bottom:20px;">' +
        '<div class="config-grid">' +
          '<div><label style="font-size:0.82rem;font-weight:700;display:block;margin-bottom:6px;">' + t('examScope') + '</label>' +
            '<select id="ex-scope" class="select"><option value="all">' + t('scopeAll') + '</option><option value="topic1">' + t('scopeT1') + '</option><option value="topic2">' + t('scopeT2') + '</option><option value="topic3">' + t('scopeT3') + '</option></select></div>' +
          '<div><label style="font-size:0.82rem;font-weight:700;display:block;margin-bottom:6px;">' + t('questionCount') + '</label>' +
            '<select id="ex-count" class="select"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option><option value="50">50</option><option value="75">75</option></select></div>' +
          '<div><label style="font-size:0.82rem;font-weight:700;display:block;margin-bottom:6px;">' + t('examTimer') + '</label>' +
            '<select id="ex-timer" class="select"><option value="0">' + t('timerNone') + '</option><option value="10">' + t('timer10') + '</option><option value="15" selected>' + t('timer15') + '</option><option value="25">' + t('timer25') + '</option></select></div>' +
          '<div style="display:flex;align-items:flex-end;"><button class="btn btn-primary" style="width:100%;" id="btn-start-ex">' + t('startExam') + '</button></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h2 style="margin:0 0 12px;font-size:1.05rem;">' + t('examHistory') + '</h2>' +
        (hist.length ? '<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Scope</th><th>Score</th><th>Time</th><th></th></tr></thead><tbody>' +
          hist.map(function (h, i) {
            return '<tr><td>' + (hist.length - i) + '</td><td>' + esc(h.scope.toUpperCase()) + '</td><td><strong>' + h.correct + '/' + h.total + ' (' + h.percentage + '%)</strong></td><td>' + fmtTime(h.elapsedSec) + '</td>' +
              '<td><button class="btn btn-secondary btn-sm" data-rev-att="' + i + '">' + t('reviewAttempt') + '</button></td></tr>';
          }).join('') + '</tbody></table></div>' : '<div class="empty-box">' + t('noExamsYet') + '</div>') +
      '</div>';

    document.getElementById('btn-start-ex').addEventListener('click', function () {
      window.MSDS_EXAMS.start({
        scope: document.getElementById('ex-scope').value,
        count: Number(document.getElementById('ex-count').value),
        timerMin: Number(document.getElementById('ex-timer').value)
      }, tickUi, function () { renderExams(); toast('Time expired — exam submitted.'); });
      renderExams();
    });
    root.querySelectorAll('[data-rev-att]').forEach(function (b) {
      b.addEventListener('click', function () {
        window.MSDS_EXAMS.setReviewAttempt(hist[Number(b.getAttribute('data-rev-att'))]);
        renderExams();
      });
    });
  }

  function tickUi(rem) {
    var el = document.getElementById('exam-timer-val');
    if (el) el.textContent = fmtTime(rem);
  }

  function openConfirmModal() {
    var m = document.getElementById('confirm-modal');
    if (m) m.classList.add('open');
  }

            '<div class="card-subtle"><div class="stat-k">' + t('strongestTopic') + '</div><strong>' + (p.strongest ? p.strongest.topicId.toUpperCase() + ' (' + p.strongest.accuracy + '%)' : '—') + '</strong></div>' +
            '<div class="card-subtle"><div class="stat-k">' + t('weakestTopic') + '</div><strong>' + (p.weakest ? p.weakest.topicId.toUpperCase() + ' (' + p.weakest.accuracy + '%)' : '—') + '</strong></div>' +
